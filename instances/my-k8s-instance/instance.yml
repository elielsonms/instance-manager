name: my-k8s-instance
schema_version: v1
type: kubernetes
description: >
  Example Kubernetes instance.  Deploys workloads to a remote Kubernetes
  cluster using a kubeconfig stored in the KUBECONFIG_DATA GitHub Secret.

# Instance-specific configuration (non-sensitive).
# Sensitive values must be stored in GitHub Secrets.
config:
  namespace: my-k8s-instance
  replicas: 1
  container_port: 8080
  service_port: 80
  service_type: ClusterIP
