name: Undeploy Release from Instance (v1)

# Schema v1 undeploy workflow.
# Supports manual dispatch (workflow_dispatch) and API-driven dispatch
# (repository_dispatch). Undeploy is a v1-specific concept; other schema
# versions may have different workflows (e.g. command-based dispatch).
#
# repository_dispatch payload example:
#   {
#     "event_type": "undeploy-from-instance",
#     "client_payload": {
#       "instance":        "my-k8s-instance",
#       "release_version": "1.2.3"
#     }
#   }
#
# All sensitive values (kubeconfig, SSH keys, cloud credentials, etc.) MUST be
# stored as GitHub Secrets and are never committed to the repository.

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Target instance name (must match a folder under instances/)"
        required: true
        type: string
      release_version:
        description: "Release version to undeploy (e.g. 1.2.3)"
        required: true
        type: string

  repository_dispatch:
    types: [undeploy-from-instance]

# Restrict the GITHUB_TOKEN to the minimum required permissions.
permissions:
  contents: read

jobs:
  undeploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Normalise inputs — works for both trigger types
      # -----------------------------------------------------------------------
      - name: Resolve event inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "instance=${{ github.event.client_payload.instance }}"               >> "$GITHUB_OUTPUT"
            echo "release_version=${{ github.event.client_payload.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "instance=${{ inputs.instance }}"               >> "$GITHUB_OUTPUT"
            echo "release_version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Validate that the instance folder and required files exist
      # -----------------------------------------------------------------------
      - name: Validate instance
        run: |
          INSTANCE="${{ steps.inputs.outputs.instance }}"

          if [ -z "$INSTANCE" ]; then
            echo "Error: instance input is required"
            exit 1
          fi

          if [ ! -d "instances/$INSTANCE" ]; then
            echo "Error: instance '$INSTANCE' not found under instances/"
            exit 1
          fi

          if [ ! -f "instances/$INSTANCE/instance.yml" ]; then
            echo "Error: instances/$INSTANCE/instance.yml is missing"
            exit 1
          fi

          if [ ! -f "instances/$INSTANCE/scripts/undeploy.sh" ]; then
            echo "Error: instances/$INSTANCE/scripts/undeploy.sh is missing"
            exit 1
          fi

          echo "Instance '$INSTANCE' validated successfully"

      # -----------------------------------------------------------------------
      # Read the schema version declared by the instance
      # -----------------------------------------------------------------------
      - name: Read schema version
        id: schema
        run: |
          INSTANCE="${{ steps.inputs.outputs.instance }}"
          VERSION=$(grep 'schema_version:' "instances/$INSTANCE/instance.yml" \
            | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "Schema version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Execute the instance's undeploy script.
      # Secrets are injected as environment variables — never hard-coded.
      # -----------------------------------------------------------------------
      - name: Execute undeploy script
        run: |
          INSTANCE="${{ steps.inputs.outputs.instance }}"
          chmod +x "instances/$INSTANCE/scripts/undeploy.sh"
          bash "instances/$INSTANCE/scripts/undeploy.sh"
        env:
          INSTANCE: ${{ steps.inputs.outputs.instance }}
          RELEASE_VERSION: ${{ steps.inputs.outputs.release_version }}
          SCHEMA_VERSION: ${{ steps.schema.outputs.version }}
          # --- Secrets (configured in GitHub repository / environment settings) ---
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          CLOUD_ACCESS_KEY: ${{ secrets.CLOUD_ACCESS_KEY }}
          CLOUD_SECRET_KEY: ${{ secrets.CLOUD_SECRET_KEY }}
