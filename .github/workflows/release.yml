name: Release into Instance

# Version-agnostic entry point.
# Accepts triggers from external projects and delegates to the workflow
# that matches the schema version of the target instance.
#
# repository_dispatch payload example:
#   {
#     "event_type": "release-into-instance",
#     "client_payload": {
#       "instance":        "my-k8s-instance",
#       "release_version": "1.2.3",
#       "image":           "myapp:1.2.3"
#     }
#   }
#
# All sensitive values (kubeconfig, SSH keys, cloud credentials, etc.) MUST be
# stored as GitHub Secrets and are never committed to the repository.

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Target instance name (must match a folder under instances/)"
        required: true
        type: string
      release_version:
        description: "Release version to deploy (e.g. 1.2.3)"
        required: true
        type: string
      image:
        description: "Container image with tag (e.g. myapp:1.2.3) — required for container-based instances"
        required: false
        type: string

  repository_dispatch:
    types: [release-into-instance]

# Restrict the GITHUB_TOKEN to the minimum required permissions.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Resolve inputs from either trigger type before calling versioned workflows
  # ---------------------------------------------------------------------------
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      instance:        ${{ steps.inputs.outputs.instance }}
      release_version: ${{ steps.inputs.outputs.release_version }}
      image:           ${{ steps.inputs.outputs.image }}
    steps:
      - name: Resolve event inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "instance=${{ github.event.client_payload.instance }}"               >> "$GITHUB_OUTPUT"
            echo "release_version=${{ github.event.client_payload.release_version }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ github.event.client_payload.image }}"                     >> "$GITHUB_OUTPUT"
          else
            echo "instance=${{ inputs.instance }}"               >> "$GITHUB_OUTPUT"
            echo "release_version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ inputs.image }}"                     >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Schema v1 — delegate to .github/workflows/v1/release.yml
  # ---------------------------------------------------------------------------
  release-v1:
    needs: resolve-inputs
    uses: ./.github/workflows/v1/release.yml
    with:
      instance:        ${{ needs.resolve-inputs.outputs.instance }}
      release_version: ${{ needs.resolve-inputs.outputs.release_version }}
      image:           ${{ needs.resolve-inputs.outputs.image }}
    secrets:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
      SERVER_HOST:     ${{ secrets.SERVER_HOST }}
      SERVER_USER:     ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY:  ${{ secrets.SERVER_SSH_KEY }}
      CLOUD_ACCESS_KEY: ${{ secrets.CLOUD_ACCESS_KEY }}
      CLOUD_SECRET_KEY: ${{ secrets.CLOUD_SECRET_KEY }}
